    app: openbao-authz-denied
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao-authz-denied
  template:
    metadata:
      labels:
        app: openbao-authz-denied
    spec:
      serviceAccountName: openbao-authz-denied
      containers:
        - name: demo
          image: curlimages/curl:8.12.1
