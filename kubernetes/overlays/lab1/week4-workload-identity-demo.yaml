apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-identity-demo
  namespace: identity
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-identity-demo
  namespace: identity
  labels:
    app: workload-identity-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-identity-demo
  template:
    metadata:
      labels:
        app: workload-identity-demo
    spec:
      serviceAccountName: workload-identity-demo
      automountServiceAccountToken: false
      containers:
        - name: demo
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - while true; do sleep 3600; done
          volumeMounts:
            - name: projected-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: projected-token
          projected:
            sources:
              - serviceAccountToken:
                  path: workload-identity-demo.jwt
                  audience: workload-identity-demo
                  expirationSeconds: 3600