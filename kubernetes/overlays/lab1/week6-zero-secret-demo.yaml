apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-authz-ok
  namespace: secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-authz-ok
  namespace: secrets
  labels:
    app: openbao-authz-ok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openbao-authz-ok
  template:
    metadata:
      labels:
        app: openbao-authz-ok
    spec:
      serviceAccountName: openbao-authz-ok
      containers:
        - name: demo
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - while true; do sleep 3600; done
---
